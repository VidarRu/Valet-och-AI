<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPERATIV — AI &amp; Valpåverkan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="hud">
      <div id="hud-title">OPERATIV</div>
      <div id="stats">
        <div class="stat">
          <span class="stat-label">TROVÄRDIGHET</span>
          <div class="stat-bar-wrap">
            <div class="stat-bar" id="bar-credibility"></div>
          </div>
          <span class="stat-value" id="val-credibility">50</span>
        </div>
        <div class="stat">
          <span class="stat-label">FÖLJARE</span>
          <div class="stat-bar-wrap">
            <div class="stat-bar" id="bar-followers"></div>
          </div>
          <span class="stat-value" id="val-followers">10</span>
        </div>
      </div>
    </header>

    <main id="game-area">

      <div id="screen-loading" class="screen active">
        <p class="loading-text">LADDAR UPPDRAG<span class="blink">_</span></p>
      </div>

      <div id="screen-briefing" class="screen">
        <div class="panel">
          <div class="label">UPPDRAGSBREV</div>
          <h2 id="briefing-title"></h2>
          <p id="briefing-text"></p>
          <button id="btn-start" class="btn-primary">BEKRÄFTA UPPDRAG</button>
        </div>
      </div>

      <div id="screen-node" class="screen">
        <div class="panel">
          <div class="label" id="scenario-label"></div>
          <p id="node-text"></p>
          <div id="choices"></div>
          <div id="consequence-box" class="hidden">
            <p id="consequence-text"></p>
            <button id="btn-continue" class="btn-secondary">FORTSÄTT</button>
          </div>
        </div>
      </div>

      <div id="screen-gameover" class="screen">
        <div class="panel panel--alert">
          <div class="label label--danger">UPPDRAG AVSLUTAT</div>
          <h2 id="gameover-title"></h2>
          <p id="gameover-text"></p>
          <button id="btn-restart" class="btn-primary">NY OMGÅNG</button>
        </div>
      </div>

      <div id="screen-win" class="screen">
        <div class="panel panel--win">
          <div class="label label--good">UPPDRAG SLUTFÖRT</div>
          <h2>Operation lyckad.</h2>
          <p id="win-text"></p>
          <div id="win-stats"></div>
          <button id="btn-restart-win" class="btn-primary">SPELA IGEN</button>
        </div>
      </div>

    </main>

    <footer id="game-footer">
      <span>Ett utbildningsspel om AI-desinformation och valpåverkan</span>
    </footer>

  </div>
  <script src="game.js"></script>
</body>
</html>
